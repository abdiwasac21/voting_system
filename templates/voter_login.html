<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f8f9fa;">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white text-center">
                        <h2>Voter Login</h2>
                    </div>
                    <div class="card-body">
                        <p class="text-center text-secondary">Enter your Voter ID below to access your account.</p>
                        <form method="POST">
                            <div class="mb-4">
                                <label for="voterID" class="form-label">Voter ID</label>
                                <input type="text" class="form-control" id="voterID" name="voterId" placeholder="Enter your Voter ID" required>
                            </div>
                            <button type="submit" class="btn btn-success btn-block w-100">Login</button>
                        </form>
                    </div>
                    <div class="card-footer text-center text-muted">
                        <small>Need help? Contact the election office or visit the <a href="#">support page</a>.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
