{% extends 'base.html' %}
{% block content %}
<h1>Election Events</h1>
<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Event Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>
    <div class="mb-3">
        <label for="start_date" class="form-label">Date</label>
        <input type="date" class="form-control" id="start_date" name="start_date" required>
    </div>
    <button type="submit" class="btn btn-primary">Add Event</button>
</form>
<hr>
<h2>Existing Events</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for event in events %}
        <tr>
            <td>{{ event.name }}</td>
            <td>{{ event.start_date }}</td>
            <td>
                <form method="POST" action="/election_events/delete/{{ event._id }}" style="display:inline;">
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
                <form method="POST" action="/election_events/update/{{ event._id }}" style="display:inline;">
                    <button type="submit" class="btn btn-warning btn-sm">Edit</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
